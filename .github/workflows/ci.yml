name: Feature regression checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  maintenance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install Gitleaks
        shell: bash
        run: |
          version=8.30.1
          archive="gitleaks_${version}_linux_x64.tar.gz"
          install_dir="$(mktemp -d)"
          cd "$install_dir"
          curl --fail --silent --show-error --location --retry 3 \
            --output "$archive" "https://github.com/gitleaks/gitleaks/releases/download/v${version}/${archive}"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $archive" | sha256sum --check --strict
          tar -xzf "$archive" gitleaks
          echo "$install_dir" >> "$GITHUB_PATH"
      - run: npm run check:secrets
      - run: npm ci
      - run: npm run check:docs
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run check:package
      - run: npx playwright install --with-deps chromium
      - name: Portable and headed browser regressions under Xvfb
        shell: bash
        run: |
          mkdir -p browser-reports
          set -o pipefail
          PLAYWRIGHT_JSON_OUTPUT_NAME=browser-reports/results.json xvfb-run --auto-servernum npm run test:browser -- --project=portable --project=headed --reporter=list,json 2>&1 | tee browser-reports/run.log
      - name: Require nonempty passing browser projects without skips or retries
        if: always()
        run: npm run check:browser-results -- browser-reports/results.json portable headed
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-regression-results
          path: |
            browser-reports/
            test-results/
          retention-days: 7
